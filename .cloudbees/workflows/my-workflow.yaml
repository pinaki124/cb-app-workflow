apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow

on:
  push:
    tags:
      - '**'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world - running for tags"

  greet-multiple:
    steps:
      - id: greet-alice
        name: Greet Alice
        uses: ./greeter
        with:
          name: Alice
      - id: greet-bob
        name: Greet Bob
        uses: ./greeter
        with:
          name: Bob
      - id: greet-charlie
        name: Greet Charlie
        uses: ./greeter
        with:
          name: Charlie
      - name: Print all greetings
        uses: docker://alpine:3.18
        run: |
          echo "Alice said: ${{ steps.greet-alice.outputs.greeting }}"
          echo "Bob said: ${{ steps.greet-bob.outputs.greeting }}"
          echo "Charlie said: ${{ steps.greet-charlie.outputs.greeting }}"
